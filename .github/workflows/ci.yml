name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore DentFlow.sln

      - name: Build
        run: dotnet build DentFlow.sln --no-restore -c Release

      # Solution-wide so a new test project cannot silently escape CI.
      # Integration tests need Docker for Testcontainers — present on ubuntu-latest.
      - name: Test
        run: >
          dotnet test DentFlow.sln --no-build -c Release
          --logger "trx;LogFileName=results.trx"
          --settings coverlet.runsettings
          --results-directory ./TestResults

      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:'./TestResults/**/coverage.cobertura.xml' \
            -targetdir:./TestResults/coverage-report \
            -reporttypes:'Html;MarkdownSummaryGithub'
          cat ./TestResults/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ./TestResults/**/*.trx
            ./TestResults/coverage-report/**
